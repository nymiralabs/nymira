[package]
name = "nymira-operatord"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Nymira operator: one binary, five processes (public API, key minter, signer, closer, watcher)"

[features]
# Rehearsal verifying keys, for the sandbox and testnet rehearsal builds.
dev-setup = ["nymira-operator/dev-setup"]

[dependencies]
axum = "0.8"
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
rand = "0.8"
nymira-near-codec = { workspace = true }
nymira-operator = { path = "../nymira-operator" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
zeroize = "1"
zkapi-proof = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { workspace = true }

[dev-dependencies]
tempfile = "3"
nymira-fake-near-ai = { path = "../nymira-fake-near-ai" }
nymira-fake-near-rpc = { path = "../nymira-fake-near-rpc" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
