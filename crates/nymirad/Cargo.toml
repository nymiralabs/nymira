[package]
name = "nymirad"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Nymira local gateway: owner token, vault pins, deposit"

[features]
# Demo and test builds only: lets the daemon talk to a sandbox without Tor. A release build
# has neither this nor any attestation-skipping switch.
mock = ["zkapi-proof/dev-setup"]

[dependencies]
age = "0.11"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blake2 = "0.10"
bech32 = "0.9"
bs58 = "0.5"
bytes = "1"
chacha20poly1305 = "0.10"
futures-util = "0.3"
hkdf = "0.12"
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
dcap-qvl = { path = "../../vendor/dcap-qvl" }
nearai-inference-sdk = { path = "../../vendor/nearai-inference-sdk" }
nymira-near-codec = { workspace = true }
nymira-operator = { path = "../nymira-operator" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal", "process"] }
zeroize = "1"
zkapi-core = { workspace = true }
zkapi-types = { workspace = true }
zkapi-proof = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-client = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-client" }

[[example]]
name = "demo"
required-features = ["mock"]

[[example]]
name = "record_evidence"
required-features = ["mock"]

[[example]]
name = "record_signature"
required-features = ["mock"]

[dev-dependencies]
nymira-fake-near-ai = { path = "../nymira-fake-near-ai" }
near-workspaces = { workspace = true }
nymira-testkit = { path = "../nymira-testkit" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
nymirad = { path = ".", features = ["mock"] }
# The operator's test harness (`tests/common` of nymira-operator) is included by path.
async-trait = "0.1"
nymira-fake-near-rpc = { path = "../nymira-fake-near-rpc" }
zkapi-core = { workspace = true }
zkapi-proof = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-proof", features = ["dev-setup", "dev-fixtures"] }
