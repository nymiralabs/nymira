[package]
name = "nymira-operator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Nymira operator: status, lease admission and the provider adapter"

[features]
# Accept the development and rehearsal verifying keys (tests, sandbox and testnet rehearsal).
dev-setup = ["zkapi-proof/dev-setup"]

[dependencies]
axum = "0.8"
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ed-on-bn254 = { workspace = true }
ark-ff = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5"
bytes = "1"
ed25519-dalek = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hex = "0.4"
lru = "0.16"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
chacha20poly1305 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the forwarded body keeps the client's key order, which the gateway signs
# (nymirad and the web app hash the bytes they sent). Set here so it does not depend on which
# other crate of a build turns it on.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic", "limit"] }
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
libc = "0.2"
tokio-stream = "0.1"
zeroize = "1"
zkapi-core = { workspace = true }
zkapi-proof = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { workspace = true }

[dev-dependencies]
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
async-trait = "0.1"
nymira-near-codec = { workspace = true }
near-workspaces = { workspace = true }
nymira-fake-near-ai = { path = "../nymira-fake-near-ai" }
nymira-fake-near-rpc = { path = "../nymira-fake-near-rpc" }
nymira-testkit = { path = "../nymira-testkit" }
tempfile = "3"
zkapi-client = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-client" }
zkapi-proof = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-proof", features = ["dev-setup", "dev-fixtures"] }
