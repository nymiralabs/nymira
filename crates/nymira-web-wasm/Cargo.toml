[package]
name = "nymira-web-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Browser checks for the chat: the operator's signed status nonce and Intel TDX quote verification"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test doubles for the browser tests: an operator's keys, the responses and clearances it signs, and the
# development withdrawal verifying key (`dev-setup`). Never in
# the app bundle (`web/scripts/check-bundle.mjs` looks for it).
test-operator = ["zkapi-proof/dev-setup"]

[dependencies]
dcap-qvl = { path = "../../vendor/dcap-qvl", default-features = false, features = ["std", "report", "rustcrypto", "js"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zkapi-core = { workspace = true }
zkapi-proof = { path = "../../vendor/zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { workspace = true }
sha2 = { workspace = true }
# Same pin as zkapi-browser and nymira-near-codec-wasm: the CLI refuses another schema version.
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4"
