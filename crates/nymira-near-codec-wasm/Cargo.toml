[package]
name = "nymira-near-codec-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nymira-near-codec = { workspace = true }
# Pinned to the wasm-bindgen-cli that web-testkit/build-codec.sh runs: the CLI
# refuses a module built against another schema version. Same pin as zkapi-browser.
wasm-bindgen = "=0.2.117"

[dev-dependencies]
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
