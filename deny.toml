[graph]
all-features = true

[advisories]
# Same set as .cargo/audit.toml: host-side test tooling only, see the reasons there.
ignore = [
  "RUSTSEC-2026-0387", "RUSTSEC-2026-0346", "RUSTSEC-2026-0285", "RUSTSEC-2026-0348",
  "RUSTSEC-2026-0349", "RUSTSEC-2026-0382", "RUSTSEC-2026-0391", "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained, via near-parameters (test tooling)
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL",
  "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
