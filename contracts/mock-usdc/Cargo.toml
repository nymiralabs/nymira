[package]
name = "mock-usdc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Test double for the USDC token (NEP-141 and NEP-145). Never deployed outside
# the sandbox; owned by the shared test harness (issue 86).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
