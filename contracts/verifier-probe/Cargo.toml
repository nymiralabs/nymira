[package]
name = "verifier-probe"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Test contract: exposes nymira-verifier so the sandbox can measure gas and
# confirm what the real host enforces. Never deployed.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
nymira-near-codec = { workspace = true }
nymira-verifier = { path = "../../crates/nymira-verifier" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
ark-bn254 = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
