[workspace]
resolver = "2"
members = ["contracts/vault", "crates/nymira-near-codec", "crates/nymira-verifier", "contracts/verifier-probe", "contracts/mock-usdc", "contracts/mock-ft-receiver", "crates/nymira-fake-near-ai", "crates/nymira-fake-near-rpc", "crates/nymira-near-codec-wasm", "crates/nymira-testkit", "crates/nymira-operator"]
# The zkapi workspace keeps its own root (its crates inherit `workspace = true`
# values from it); ours reach it by path.
exclude = ["vendor/zkapi/protocol/rust"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
near-sdk = { version = "=5.29.1", default-features = false }
near-workspaces = "=0.23.0"
zkapi-core = { path = "vendor/zkapi/protocol/rust/crates/zkapi-core" }
zkapi-types = { path = "vendor/zkapi/protocol/rust/crates/zkapi-types" }
nymira-near-codec = { path = "crates/nymira-near-codec" }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ed-on-bn254 = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }

# Proving tests are minutes slower with unoptimized arkworks.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
