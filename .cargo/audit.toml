# Each advisory below is in host-side test tooling (near-workspaces, near-sdk's
# unit-testing VM, arkworks' std features), in a compile-time proc macro, in
# nymirad's attestation verification (rsa, age) or, for RUSTSEC-2025-0055, in the
# vault's wasm tree without a path to it (see that line). The reason is on each line. Newer versions are blocked by the exact
# near-sdk/near-workspaces pins (a rustls bump conflicts on aws-lc-rs; zstd 0.14
# and crypto-bigint 0.7 are major bumps). Revisit when those pins move.
[advisories]
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5, via near-sdk unit-testing VM
  "RUSTSEC-2026-0346", # rustls 0.23.43, via near-workspaces
  "RUSTSEC-2026-0285", # rustls 0.23.43
  "RUSTSEC-2026-0348", # rustls 0.23.43
  "RUSTSEC-2026-0349", # rustls 0.23.43
  "RUSTSEC-2026-0382", # rustls-webpki 0.103.13
  "RUSTSEC-2026-0391", # zstd 0.13.3, via near-primitives
  "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained, via near-parameters
  "RUSTSEC-2025-0055", # tracing-subscriber 0.2.25, via ark-relations; it IS in the vault wasm tree (checked 2026-11-03 with cargo tree), but the advisory is ANSI escapes in formatted log output and a contract installs no subscriber, so there is no path to it
  "RUSTSEC-2024-0388", # derivative unmaintained, proc macro of ark-crypto-primitives (compile time)
  "RUSTSEC-2024-0436", # paste unmaintained, proc macro of ark-ff (compile time)
  "RUSTSEC-2026-0253", # lru 0.16.4, via near-vm-runner (unit-testing VM)
  "RUSTSEC-2026-0403", # zstd-safe 7.3.0
  "RUSTSEC-2026-0398", # zstd-safe 7.3.0
  "RUSTSEC-2026-0395", # zstd-safe 7.3.0
  "RUSTSEC-2026-0402", # zstd-safe 7.3.0
  "RUSTSEC-2026-0406", # zstd-safe 7.3.0
  "RUSTSEC-2026-0404", # zstd-safe 7.3.0
  "RUSTSEC-2026-0400", # zstd-safe 7.3.0
  "RUSTSEC-2026-0399", # zstd-safe 7.3.0
  "RUSTSEC-2026-0401", # zstd-safe 7.3.0
  "RUSTSEC-2026-0405", # zstd-safe 7.3.0
  "RUSTSEC-2026-0397", # zstd-safe 7.3.0
  "RUSTSEC-2026-0396", # zstd-safe 7.3.0
  "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained, compile-time macro of age (nymirad backups)
  "RUSTSEC-2026-0374", # basic-toml unmaintained, compile-time dependency of age's i18n macros
  # rsa 0.9.10 (Marvin attack, key recovery by timing of RSA decryption), via dcap-qvl-webpki and
  # the SDK's jsonwebtoken. nymirad only verifies RSA signatures (Intel's chain, NVIDIA's JWT keys);
  # it holds no RSA private key and decrypts nothing. No fixed version exists.
  "RUSTSEC-2023-0071",
  # libsqlite3-sys 0.35.0 (bundled SQLite before 3.54.0 can return uninitialized memory when it opens
  # a database file next to a -wal file with a different page size; local, needs crafted files).
  # Only the operator uses it, and it opens only its own database at the path it is configured with,
  # which it created. Nothing opens a database or a -wal file that someone else supplied. The fix needs
  # rusqlite 0.41, a change to the operator's dependencies that waits for after release 0.1.3.
  "RUSTSEC-2026-0459",
]
