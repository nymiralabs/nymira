name: web-deploy

# Publishes a signed release to Cloudflare Pages and to the GitHub Pages mirror. It runs by hand
# against a tag. The build job has no secrets; the signed manifest comes from the repository
# (web/releases/<profile>-<version>/, signed offline); the verify step uses the committed public
# key; the deploy jobs get only the verified site. An unsigned or mismatching build stops at verify.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (the release tag, for example web-v0.1.0)"
        required: true
      profile:
        description: "testnet or mainnet"
        required: true
        default: testnet
      version:
        description: "Version in the signed manifest"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch the ceremony's proving keys (the build checks their hashes against the profile)
        run: |
          mkdir -p "$RUNNER_TEMP/setup"
          for f in request.pk withdrawal.pk; do
            curl -fsSL -o "$RUNNER_TEMP/setup/$f" \
              "https://github.com/nymiralabs/nymira-ceremony/releases/download/final/$f"
          done
      - name: Build and assemble
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          export NYMIRA_SETUP_DIR="$RUNNER_TEMP/setup"
          web/scripts/build-wasm.sh
          cd web
          npm ci --ignore-scripts
          node node_modules/vite/bin/vite.js build --mode "$PROFILE" --outDir "dist-$PROFILE"
          npm run check:bundle -- "dist-$PROFILE" "$PROFILE" --require-keys
          node scripts/integrity.mjs assemble --dist "dist-$PROFILE" --meta "dist-$PROFILE-meta" \
            --out "site-$PROFILE" --version "$VERSION" --profile "$PROFILE"
      - name: Add the offline signature and refuse an unsigned or mismatching build
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          cd web
          signed="releases/$PROFILE-$VERSION"
          test -f "$signed/manifest.json.minisig" || { echo "unsigned build: $signed/manifest.json.minisig is missing" >&2; exit 1; }
          cmp "$signed/manifest.json" "site-$PROFILE/manifest.json" \
            || { echo "the rebuilt manifest is not the signed one" >&2; exit 1; }
          cp "$signed/manifest.json.minisig" "site-$PROFILE/"
          node scripts/integrity.mjs verify --site "site-$PROFILE" --pubkey pins/release-signing.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/site-${{ inputs.profile }}
          include-hidden-files: true
          retention-days: 7

  cloudflare:
    needs: build
    runs-on: ubuntu-24.04
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Check again that the downloaded site is the signed one
        run: node web/scripts/integrity.mjs verify --site site --pubkey web/pins/release-signing.pub
      - name: Deploy (pinned wrangler)
        working-directory: web/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --ignore-scripts
          npx wrangler pages deploy "$GITHUB_WORKSPACE/site" --project-name nymira --branch main \
            --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: The live site is the signed release
        run: node web/scripts/check-live.mjs https://nymira.pages.dev site

  # The mirror: same files, no custom headers (a static host cannot set them).
  github-pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
