name: web-deploy

# Publishes a signed release to Cloudflare Pages and to the GitHub Pages mirror. It runs by hand
# against a tag. The build job has no secrets; the signed manifest comes from the repository
# (web/releases/<profile>-<version>/, signed offline); the verify step uses the committed public
# key; the deploy jobs get only the verified site. An unsigned or mismatching build stops at verify.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (the release tag, for example web-v0.1.0)"
        required: true
      profile:
        description: "testnet or mainnet"
        required: true
        default: testnet
      version:
        description: "Version in the signed manifest"
        required: true
      policy_only:
        description: "true: the policy changed and the release did not. Reuse the site of an earlier deploy of this release (checked against the signed manifest again) instead of rebuilding it; a full rebuild runs when none is found."
        required: false
        default: "false"
      policy_ref:
        description: "Optional: a commit whose web/pins/attestation-policy.json is a newer signed policy to put beside the release (ADR 0021). Empty: none."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuse an unsigned release
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          test -f "web/releases/$PROFILE-$VERSION/manifest.json.minisig" || { echo "unsigned build: web/releases/$PROFILE-$VERSION/manifest.json.minisig is missing" >&2; exit 1; }
      # The release is rebuilt in the pinned container of web/Dockerfile.repro, the same one an
      # outside rebuilder uses (web/INTEGRITY.md), so the signed manifest is the one every rebuild gives.
      # A policy-only deployment: the signed bundle is the one an earlier run already built and
      # verified. Its artifact is taken only when its manifest is byte for byte the signed one;
      # the signature and every file hash are checked again below. No such artifact (it expires
      # after seven days): the full rebuild runs.
      - name: Reuse the site of an earlier deploy of this release
        id: reuse
        if: inputs.policy_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-deploy.yml --status success --limit 15 --json databaseId --jq '.[].databaseId'); do
            rm -rf "web/site-$PROFILE"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n site -D "web/site-$PROFILE" 2>/dev/null || continue
            if cmp -s "web/releases/$PROFILE-$VERSION/manifest.json" "web/site-$PROFILE/manifest.json"; then
              echo "reusing the site of run $id"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          rm -rf "web/site-$PROFILE"
          echo "no earlier site of $VERSION found: rebuilding"
      - name: Rebuild in the pinned container and compare with the signed manifest
        if: steps.reuse.outputs.ok != 'true'
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          web/scripts/rebuild-in-container.sh HEAD "$PROFILE" "$VERSION" "web/site-$PROFILE"
          cmp "web/releases/$PROFILE-$VERSION/manifest.json" "web/site-$PROFILE/manifest.json" \
            || { echo "the rebuilt manifest is not the signed one" >&2; exit 1; }
      - name: Add the offline signature and verify it
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          cd web
          cp "releases/$PROFILE-$VERSION/manifest.json.minisig" "site-$PROFILE/"
          node scripts/integrity.mjs verify --site "site-$PROFILE" --pubkey pins/release-signing.pub
      # The current signed policy beside the release (ADR 0021). The page takes it only if it verifies
      # under the signer key of the release and is not older than the policy bundled in it, so the
      # signed bundle stays as it was. The tool loads it the way a client does; an unsigned or
      # older file stops the deploy here.
      - name: Take the policy from its commit (main when no commit is given)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.policy_ref || 'main' }}
          path: policy-src
          persist-credentials: false
      - name: Verify the policy and put it beside the release
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          bundled=$(node -e "console.log(JSON.parse(require('fs').readFileSync('web/pins/attestation-policy.json','utf8')).version)")
          cargo run --locked -q -p nymirad --example policy_tool -- verify \
            web/pins/policy-signer.pub policy-src/web/pins/attestation-policy.json "$bundled"
          cp policy-src/web/pins/attestation-policy.json "web/site-$PROFILE/attestation-policy.json"
          node web/scripts/integrity.mjs verify --site "web/site-$PROFILE" --pubkey web/pins/release-signing.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/site-${{ inputs.profile }}
          include-hidden-files: true
          retention-days: 7

  cloudflare:
    needs: build
    runs-on: ubuntu-24.04
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Check again that the downloaded site is the signed one
        run: node web/scripts/integrity.mjs verify --site site --pubkey web/pins/release-signing.pub
      - name: Get the current policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: policy-current
          persist-credentials: false
      - name: Refuse an outdated policy
        run: node policy-current/web/scripts/check-deploy-policy.mjs policy-current/web/pins/attestation-policy.json web/pins/attestation-policy.json site https://nymira.pages.dev/attestation-policy.json
      - name: Deploy (pinned wrangler)
        working-directory: web/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --ignore-scripts
          npx wrangler pages deploy "$GITHUB_WORKSPACE/site" --project-name nymira --branch main \
            --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: The live site is the signed release
        run: node web/scripts/check-live.mjs https://nymira.pages.dev site

  # The mirror: same files, no custom headers (a static host cannot set them).
  github-pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Get the release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: release-src
          persist-credentials: false
      - name: Get the current policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: policy-current
          persist-credentials: false
      - name: Refuse an outdated policy
        run: node policy-current/web/scripts/check-deploy-policy.mjs policy-current/web/pins/attestation-policy.json release-src/web/pins/attestation-policy.json site https://nymiralabs.github.io/nymira/attestation-policy.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: retry1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.retry1.outcome == 'failure'
        run: sleep 30
      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
