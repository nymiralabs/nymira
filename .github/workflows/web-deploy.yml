name: web-deploy

# Publishes a signed release to Cloudflare Pages and to the GitHub Pages mirror. It runs by hand
# against a tag. The build job has no secrets; the signed manifest comes from the repository
# (web/releases/<profile>-<version>/, signed offline); the verify step uses the committed public
# key; the deploy jobs get only the verified site. An unsigned or mismatching build stops at verify.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (the release tag, for example web-v0.1.0)"
        required: true
      profile:
        description: "testnet or mainnet"
        required: true
        default: testnet
      version:
        description: "Version in the signed manifest"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuse an unsigned release
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          test -f "web/releases/$PROFILE-$VERSION/manifest.json.minisig" || { echo "unsigned build: web/releases/$PROFILE-$VERSION/manifest.json.minisig is missing" >&2; exit 1; }
      # The release is rebuilt in the pinned container of web/Dockerfile.repro, the same one an
      # outside rebuilder uses (web/INTEGRITY.md), so the signed manifest is the one every rebuild gives.
      - name: Rebuild in the pinned container and compare with the signed manifest
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          web/scripts/rebuild-in-container.sh HEAD "$PROFILE" "$VERSION" "web/site-$PROFILE"
          cmp "web/releases/$PROFILE-$VERSION/manifest.json" "web/site-$PROFILE/manifest.json" \
            || { echo "the rebuilt manifest is not the signed one" >&2; exit 1; }
      - name: Add the offline signature and verify it
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ inputs.version }}
        run: |
          cd web
          cp "releases/$PROFILE-$VERSION/manifest.json.minisig" "site-$PROFILE/"
          node scripts/integrity.mjs verify --site "site-$PROFILE" --pubkey pins/release-signing.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/site-${{ inputs.profile }}
          include-hidden-files: true
          retention-days: 7

