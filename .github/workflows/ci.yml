name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "NOTICE"]

permissions:
  contents: read

# A new push cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # The workspace's test binaries (arkworks, near-workspaces, sqlite) fill the runner's disk
      # with debug info; nothing here reads it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space (preinstalled toolchains the job does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-near 0.22.0 (release binary, checksum pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o cargo-near.tar.gz \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz
          install -m 0755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - name: Contracts compile for wasm
        run: cargo check --target wasm32-unknown-unknown --locked -p nymira-vault -p nymira-near-codec -p nymira-verifier -p verifier-probe -p mock-usdc -p mock-ft-receiver -p nymira-near-codec-wasm
      - run: cargo test --workspace --locked

  # The vendored zkapi workspace has its own lockfile and target directory,
  # so it builds in parallel with the job above.
  zkapi-vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: vendor/zkapi/protocol/rust
      - name: Vendored zkapi tests
        working-directory: vendor/zkapi/protocol/rust
        run: cargo test --locked -p zkapi-types -p zkapi-core -p zkapi-proof --lib

  # The test wallet and the browser build of the NEAR codec (issue 86).
  web-testkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the codec for the browser
        run: web-testkit/build-codec.sh
      - name: Install dependencies and the browser
        working-directory: web-testkit
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Self-tests
        working-directory: web-testkit
        run: npm test

  # The web app (issue 36): build, unit tests, and Playwright against the fake NEAR RPC and the
  # test wallet, on Chromium and WebKit. Installs run with --ignore-scripts and the lockfile.
  web:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Free disk space (preinstalled toolchains the job does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            vendor/zkapi/protocol/rust
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the WASM modules (zkapi wallet core, NEAR codec)
        run: web/scripts/build-wasm.sh
      - name: Install dependencies and the browsers
        run: |
          (cd web-testkit && npm ci --ignore-scripts)
          cd web
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Typecheck, format, executor pins
        working-directory: web
        run: |
          npm run typecheck
          npm run format:check
          npm run check:executors
      - name: Unit tests
        working-directory: web
        run: npm run test:unit
      - name: Deployable bundles hold no test-only content
        working-directory: web
        run: |
          npm run build
          npm run check:bundle -- dist testnet
          npm run build:mainnet
          npm run check:bundle -- dist mainnet
      - name: Playwright (builds the mock bundle itself)
        working-directory: web
        run: npm run test:e2e
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 7

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Vault dependencies
        run: scripts/check-vault-deps.sh
      - name: Unsafe profiles are refused
        run: scripts/check-profiles.sh

  # nymirad in Tor mode: every connect() of the egress test stays on loopback (issue 32).
  egress:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: No direct connection in Tor mode
        run: scripts/egress-check.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
