name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Install cargo-near
        run: cargo install cargo-near --version =0.22.0 --locked
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Vendored zkapi tests
        working-directory: vendor/zkapi/protocol/rust
        run: cargo test --locked -p zkapi-types -p zkapi-core -p zkapi-proof --lib

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - name: Vault dependencies
        run: scripts/check-vault-deps.sh
      - name: Unsafe profiles are refused
        run: scripts/check-profiles.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
