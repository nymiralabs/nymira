name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "NOTICE"]

permissions:
  contents: read

# A new push cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the push touches decides which of the slow jobs run. A push to main and a diff that
  # cannot be read run everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      zkapi: ${{ steps.scope.outputs.zkapi }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rust=true; zkapi=true; web=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only "$BASE" HEAD) && [ -n "$files" ]; then
            hit() { printf '%s\n' "$files" | grep -Eq "$1"; }
            # A diff of only the web app's sources and tests (web/src, web/e2e, web/test) skips Rust.
            rust=false; zkapi=false; web=false
            if printf '%s\n' "$files" | grep -Evq '^web/(src|e2e|test)/'; then rust=true; fi
            if hit '^(vendor/zkapi/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then zkapi=true; fi
            if hit '^(web/|web-testkit/|vendor/|crates/nymira-(near-codec|near-codec-wasm|web-wasm|fake-near-rpc)/|crates/nymirad/pins/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then web=true; fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "zkapi=$zkapi" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      # The workspace's test binaries (arkworks, near-workspaces, sqlite) fill the runner's disk
      # with debug info; nothing here reads it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space (preinstalled toolchains the job does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-near 0.22.0 (release binary, checksum pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o cargo-near.tar.gz \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz
          install -m 0755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - name: Contracts compile for wasm
        run: cargo check --target wasm32-unknown-unknown --locked -p nymira-vault -p nymira-near-codec -p nymira-verifier -p verifier-probe -p mock-usdc -p mock-ft-receiver -p nymira-near-codec-wasm
      # `nymirad`'s web_interop test runs the web app's own code (vitest) and needs its WASM builds
      # and dependencies. It fails, never skips, when they are missing.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the web WASM modules and install the web dependencies
        run: |
          web/scripts/build-wasm.sh
          cd web
          npm ci --ignore-scripts
      - run: cargo test --workspace --locked
      # The five operator processes against the fakes, one TCP listener (needs `lsof`).
      - name: Operator processes (dev-setup)
        run: cargo test --locked -p nymira-operatord --features dev-setup
      - name: The operator fuzz targets build
        run: cargo check --locked --manifest-path crates/nymira-operator/fuzz/Cargo.toml

  # What a newcomer runs from a clean checkout: `make demo` builds, and the golden path (a note
  # deposited, used, settled, closed and retired in the mock stack) passes (issue 35).
  quickstart:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space (preinstalled toolchains the job does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-near 0.22.0 (release binary, checksum pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o cargo-near.tar.gz \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz
          install -m 0755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - run: make quickstart

  # The vendored zkapi workspace has its own lockfile and target directory,
  # so it builds in parallel with the job above.
  zkapi-vendor:
    needs: changes
    if: needs.changes.outputs.zkapi == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: vendor/zkapi/protocol/rust
      - name: Vendored zkapi tests
        working-directory: vendor/zkapi/protocol/rust
        run: cargo test --locked -p zkapi-types -p zkapi-core -p zkapi-proof -p zkapi-browser -p zkapi-client --lib
      - name: Setup import gate and key checks (release)
        working-directory: vendor/zkapi/protocol/rust
        run: cargo test --release --locked -p zkapi-proof --test proofs --test zkey_import

  # The test wallet and the browser build of the NEAR codec (issue 86).
  web-testkit:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    # Normally under a minute; a stalled install is cut off instead of waiting six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the codec for the browser
        run: web-testkit/build-codec.sh
      - name: Install dependencies and the browser
        working-directory: web-testkit
        # The browser's system libraries come from the Ubuntu mirror, which stalls now and then (see
        # the web job): short apt timeouts, Canonical's mirror on the first and third try, and a try
        # that hangs is killed after 5 minutes together with any apt or dpkg process it left.
        run: |
          npm ci
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::http::Pipeline-Depth "0";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          sudo cp /etc/apt/apt-mirrors.txt /tmp/apt-mirrors.runner
          for try in 1 2 3; do
            if [ "$try" = 2 ]; then
              sudo cp /tmp/apt-mirrors.runner /etc/apt/apt-mirrors.txt
            else
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "browser install attempt $try failed or timed out" >&2
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Self-tests
        working-directory: web-testkit
        run: npm test

  # The web app (issue 36): build, unit tests, and Playwright against the fake NEAR RPC and the
  # test wallet, on Chromium and WebKit. Installs run with --ignore-scripts and the lockfile.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    # Shard 0 runs the static checks and unit tests; shards 1-4 each run a quarter of the
    # Playwright files (the fake chain is per runner, so shards do not share it).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    name: web (${{ matrix.shard == 0 && 'static' || format('e2e {0}/4', matrix.shard) }})
    # The longest shard takes about 15 minutes; a stalled job is cut off instead of waiting six hours.
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Free disk space (preinstalled toolchains the job does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            vendor/zkapi/protocol/rust
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the WASM modules (zkapi wallet core, NEAR codec)
        run: web/scripts/build-wasm.sh
      - name: Install dependencies and the browsers
        run: |
          (cd web-testkit && npm ci --ignore-scripts)
          cd web
          npm ci --ignore-scripts
      - name: Install the browsers
        if: matrix.shard != 0
        working-directory: web
        # The browsers' system libraries are 181 packages (114 MB). On 5 November 2026 the download
        # from the Azure Ubuntu mirror stopped after a few files and sat idle until the job was cut
        # off, on every try of the same job. apt gets no pipelining and short timeouts; a try that
        # still hangs is killed after 5 minutes together with any apt or dpkg process it left, and
        # the next try uses Canonical's own mirror.
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::http::Pipeline-Depth "0";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              echo 'http://archive.ubuntu.com/ubuntu/ priority:1' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            timeout 300 npx playwright install --with-deps chromium webkit && exit 0
            echo "browser install attempt $try failed or timed out" >&2
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Typecheck, format, executor pins
        if: matrix.shard == 0
        working-directory: web
        run: |
          npm run typecheck
          npm run format:check
          npm run check:executors
      - name: Unit tests
        if: matrix.shard == 0
        working-directory: web
        run: npm run test:unit
      - name: Deployable bundles hold no test-only content
        if: matrix.shard == 0
        working-directory: web
        run: |
          npm run build
          npm run check:bundle -- dist testnet
          mv dist dist-testnet && mv dist-meta dist-testnet-meta
          npm run build:mainnet
          npm run check:bundle -- dist mainnet
          mv dist dist-mainnet && mv dist-meta dist-mainnet-meta
      - name: Header policy and manifest checks (assemble refuses a policy with unsafe-eval; an unsigned site fails verify)
        if: matrix.shard == 0
        working-directory: web
        run: |
          for p in testnet mainnet; do
            node scripts/integrity.mjs assemble --dist dist-$p --meta dist-$p-meta --out site-$p --version 0.0.0-ci --profile $p
            if node scripts/integrity.mjs verify --site site-$p --pubkey test-fixtures/integrity/minisign.pub; then
              echo "an unsigned site passed verify" >&2; exit 1
            fi
          done
          node scripts/integrity.mjs verify --site test-fixtures/integrity/site --pubkey test-fixtures/integrity/minisign.pub
      - name: Playwright (builds the mock bundle itself)
        if: matrix.shard != 0
        working-directory: web
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Playwright report on failure
        if: failure() && matrix.shard != 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7

  policy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Vault dependencies
        run: scripts/check-vault-deps.sh
      - name: Unsafe profiles are refused
        run: scripts/check-profiles.sh
      - name: The fuzz target builds
        run: cargo check --locked --manifest-path contracts/vault/fuzz/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The vault key watcher
        run: make watch-test

  # nymirad in Tor mode: every connect() of the egress test stays on loopback (issue 32).
  egress:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: No direct connection in Tor mode
        run: scripts/egress-check.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
