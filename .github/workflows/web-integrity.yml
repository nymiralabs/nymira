name: web-integrity

# Checks that do not belong in the main test job: the double build, the dependency record and
# the release binary. None of them has a secret.
on:
  push:
    branches: [main]
    paths: ["web/**", "web-testkit/**", "crates/**", "scripts/**", ".github/workflows/web-integrity.yml"]
  pull_request:
    paths: ["web/**", "web-testkit/**", "crates/**", "scripts/**", ".github/workflows/web-integrity.yml"]

permissions:
  contents: read

concurrency:
  group: web-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two builds of the same commit, in two directories with separate cargo output, give one hash.
  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space (two cargo target directories are built)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build twice and compare the bundle hashes
        run: web/scripts/repro-check.sh testnet mainnet

  # Third-party code is downloaded here (npm packages, checked against the registry). Read-only
  # token, no secrets, no cache: nothing this job fetches can reach a release job.
  dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Minimum release age, registry hash, provenance
        run: |
          node web/scripts/check-deps.mjs web/package-lock.json web/pins/dependency-exceptions.json
          node web/scripts/check-deps.mjs web-testkit/package-lock.json web-testkit/dependency-exceptions.json
          node web/scripts/check-deps.mjs web/deploy/package-lock.json web/deploy/dependency-exceptions.json
      - name: Signatures and attestations (lockfile install, scripts off)
        run: |
          for dir in web web-testkit web/deploy; do
            (cd "$dir" && npm ci --ignore-scripts && npm audit signatures)
          done

  # The release nymirad has no mock feature and no demo strings; the check also fails a mock build.
  release-binary:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: scripts/check-release-binary.sh --control
