# NEAR AI's live evidence still passes the checks of the app, and the signed policy lists it.
# Chats break when Intel's TCB status of NEAR AI's hardware leaves UpToDate, when Intel's collateral
# expires or when a deployment is not in the policy. `policy-watch` sees the last one; nothing else
# sees the first two before users do. This run fetches fresh reports, verifies every entry the way
# the policy signer does (scripts/verify-live.mjs) and compares the result with the policy on main.
# GitHub emails the repository admins when it fails. It signs and deploys nothing.
name: attestation-health
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.117
      - name: Build the quote verifier (WASM) and install the web dependencies
        run: |
          WASM_ONLY=web-checks web/scripts/build-wasm.sh
          cd web
          npm ci --ignore-scripts
      - name: Every live entry verifies (Intel quote, UpToDate TCB, nonce, signer, event log, compose)
        working-directory: web
        run: node --import ./scripts/lib/register-ts.mjs scripts/verify-live.mjs --out "$RUNNER_TEMP/verified.json"
      - name: The signed policy lists every verified deployment
        working-directory: web
        run: |
          code=0
          node scripts/watch-policy.mjs --observed "$RUNNER_TEMP/verified.json" || code=$?
          # 3: a deployment is not listed. policy-watch deals with it; say so here as well.
          [ "$code" = 0 ] || { echo "the live deployments are not all in the signed policy (exit $code)" >&2; exit 1; }
