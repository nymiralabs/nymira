name: vault-reproducible

# Rebuilds the published testnet vault on an amd64 runner, in the pinned cargo-near container,
# and compares the wasm with the hash published in the README (built on an arm64 Mac). The
# contract embeds its source revision, so only the tagged commit can give that hash.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/vault-reproducible.yml"
      - "contracts/vault/Cargo.toml"
      - "contracts/vault/Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

env:
  TAG: vault-testnet-1
  # README, "Vault code hash": SHA-256 of nymira_vault.wasm at that tag.
  PUBLISHED: 5940b853e51476c69ab2cd0ffba2fb76ffd3fedb621a2471c9ccd2bdb62ad4f5

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - run: git rev-parse HEAD
      # The prebuilt release, pinned by hash: building cargo-near from source needs libudev.
      - name: Install cargo-near 0.22.0
        run: |
          curl -fsSL -o cargo-near.tar.gz https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          cargo near --version
      - name: Build in the pinned container, twice
        working-directory: contracts/vault
        run: |
          build() {
            cargo near build reproducible-wasm >&2
            sha256sum ../../target/near/nymira_vault/nymira_vault.wasm | cut -d' ' -f1
          }
          first=$(build)
          rm -f ../../target/near/nymira_vault/nymira_vault.wasm
          second=$(build)
          echo "tag $TAG commit $(git rev-parse HEAD)"
          echo "first build:  $first"
          echo "second build: $second"
          echo "published:    $PUBLISHED"
          [ "$first" = "$second" ] || { echo "two builds of one commit differ" >&2; exit 1; }
          [ "$first" = "$PUBLISHED" ] || { echo "the amd64 build differs from the published hash" >&2; exit 1; }
          echo "amd64 build equals the published hash"
