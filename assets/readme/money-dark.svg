<rect class="cell" x="556" y="150" width="15" height="22" fill="#ffffff48" style="animation-delay:170ms"/>
<rect class="cell ac" x="574.5" y="150.5" width="14" height="21" style="animation-delay:180ms"/>
<rect class="cell ac" x="592.5" y="150.5" width="14" height="21" style="animation-delay:190ms"/>
<text x="628" y="167" class="m mu" font-size="13">0.10 reserved, nothing spent yet</text>
<text x="48" y="217" font-size="16">The lease ends</text>
