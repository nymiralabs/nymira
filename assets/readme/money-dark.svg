<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
<title id="t">Where the USDC goes</title>
<desc id="d">A 1 USDC note costs 1.05 USDC with the fee. A lease reserves 0.10 USDC and, when it ends, charges its usage with a minimum of 0.002 USDC. A close from the wallet pays the rest to the payout account with no close fee.</desc>
<style>
text{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',system-ui,sans-serif;fill:#fafafa}
.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mu{fill:#a1a1a1}
.ln{stroke:#3a3a3a;fill:none;stroke-width:1}
.ac{stroke:#9aa8ff;fill:none;stroke-width:1}
.hatch{fill:url(#hatch)}
.cell{animation:cell-in .5s cubic-bezier(.16,1,.3,1) both}
@keyframes cell-in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9aa8ff" stroke-width="1.2"/></pattern>
</defs>

<text x="48" y="44" font-size="22">Where the USDC goes</text>
<text x="48" y="68" class="mu" font-size="15">One cell is 0.05 USDC. An example: a short chat with z-ai/glm-5.3-flash on a 1 USDC note.</text>
<text x="48" y="117" font-size="16">Deposit</text>
<rect class="cell" x="250" y="100" width="15" height="22" fill="#ffffff48" style="animation-delay:0ms"/>
<rect class="cell" x="268" y="100" width="15" height="22" fill="#ffffff48" style="animation-delay:10ms"/>
