<g class="cell" style="animation-delay:200ms"><rect x="610" y="100" width="15" height="22" class="hatch"/><rect x="610.5" y="100.5" width="14" height="21" class="ac"/></g>
<text x="646" y="117" class="m mu" font-size="13">1.05 = 1.00 note + 0.05 fee</text>
<text x="48" y="167" font-size="16">A lease opens</text>
