<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
<title id="t">The life of a note</title>
<desc id="d">A note is open for 30 days. At 5 days left the app tries a close, at 3 days left an exit if the close failed. Seven days after expiry the treasury can take the deposit unless an exit is pending.</desc>
<style>
text{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',system-ui,sans-serif;fill:#161616}
.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mu{fill:#626262}
.ln{stroke:#d4d4d4;fill:none;stroke-width:1}
.ac{stroke:#3b4cc0;fill:none;stroke-width:1}
.hatch{fill:url(#hatch)}
.cell{animation:cell-in .5s cubic-bezier(.16,1,.3,1) both}
@keyframes cell-in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#3b4cc0" stroke-width="1.2"/></pattern>
</defs>

<text x="48" y="44" font-size="22">The life of a note</text>
<text x="48" y="68" class="mu" font-size="15">One cell is one day. The numbers come from the vault (30 days, a 7-day window) and the expiry guard (5 and 3 days).</text>
<rect class="cell" x="48" y="84" width="17" height="20" fill="#00000040" style="animation-delay:0ms"/>
<rect class="cell" x="69" y="84" width="17" height="20" fill="#00000040" style="animation-delay:16ms"/>
<rect class="cell" x="90" y="84" width="17" height="20" fill="#00000040" style="animation-delay:32ms"/>
<rect class="cell" x="111" y="84" width="17" height="20" fill="#00000040" style="animation-delay:48ms"/>
<rect class="cell" x="132" y="84" width="17" height="20" fill="#00000040" style="animation-delay:64ms"/>
<rect class="cell" x="153" y="84" width="17" height="20" fill="#00000040" style="animation-delay:80ms"/>
<rect class="cell" x="174" y="84" width="17" height="20" fill="#00000040" style="animation-delay:96ms"/>
<rect class="cell" x="195" y="84" width="17" height="20" fill="#00000040" style="animation-delay:112ms"/>
<rect class="cell" x="216" y="84" width="17" height="20" fill="#00000040" style="animation-delay:128ms"/>
<rect class="cell" x="237" y="84" width="17" height="20" fill="#00000040" style="animation-delay:144ms"/>
<rect class="cell" x="258" y="84" width="17" height="20" fill="#00000040" style="animation-delay:160ms"/>
<rect class="cell" x="279" y="84" width="17" height="20" fill="#00000040" style="animation-delay:176ms"/>
<rect class="cell" x="300" y="84" width="17" height="20" fill="#00000040" style="animation-delay:192ms"/>
<rect class="cell" x="321" y="84" width="17" height="20" fill="#00000040" style="animation-delay:208ms"/>
<rect class="cell" x="342" y="84" width="17" height="20" fill="#00000040" style="animation-delay:224ms"/>
<rect class="cell" x="363" y="84" width="17" height="20" fill="#00000040" style="animation-delay:240ms"/>
<rect class="cell" x="384" y="84" width="17" height="20" fill="#00000040" style="animation-delay:256ms"/>
<rect class="cell" x="405" y="84" width="17" height="20" fill="#00000040" style="animation-delay:272ms"/>
<rect class="cell" x="426" y="84" width="17" height="20" fill="#00000040" style="animation-delay:288ms"/>
<rect class="cell" x="447" y="84" width="17" height="20" fill="#00000040" style="animation-delay:304ms"/>
<rect class="cell" x="468" y="84" width="17" height="20" fill="#00000040" style="animation-delay:320ms"/>
<rect class="cell" x="489" y="84" width="17" height="20" fill="#00000040" style="animation-delay:336ms"/>
<rect class="cell" x="510" y="84" width="17" height="20" fill="#00000040" style="animation-delay:352ms"/>
<rect class="cell" x="531" y="84" width="17" height="20" fill="#00000040" style="animation-delay:368ms"/>
<rect class="cell" x="552" y="84" width="17" height="20" fill="#00000040" style="animation-delay:384ms"/>
<g class="cell" style="animation-delay:400ms"><rect x="573" y="84" width="17" height="20" class="hatch"/><rect x="573.5" y="84.5" width="16" height="19" class="ac"/></g>
<g class="cell" style="animation-delay:416ms"><rect x="594" y="84" width="17" height="20" class="hatch"/><rect x="594.5" y="84.5" width="16" height="19" class="ac"/></g>
<g class="cell" style="animation-delay:432ms"><rect x="615" y="84" width="17" height="20" class="hatch"/><rect x="615.5" y="84.5" width="16" height="19" class="ac"/></g>
<g class="cell" style="animation-delay:448ms"><rect x="636" y="84" width="17" height="20" class="hatch"/><rect x="636.5" y="84.5" width="16" height="19" class="ac"/></g>
<g class="cell" style="animation-delay:464ms"><rect x="657" y="84" width="17" height="20" class="hatch"/><rect x="657.5" y="84.5" width="16" height="19" class="ac"/></g>
<rect class="cell" x="678.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:480ms"/>
<rect class="cell" x="699.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:496ms"/>
<rect class="cell" x="720.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:512ms"/>
<rect class="cell" x="741.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:528ms"/>
<rect class="cell" x="762.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:544ms"/>
<rect class="cell" x="783.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:560ms"/>
<rect class="cell" x="804.5" y="84.5" width="16" height="19" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:576ms"/>
<text x="48" y="126" text-anchor="start" class="m mu" font-size="13">day 0</text><text x="48" y="146" text-anchor="start" font-size="15">Deposit</text>
<text x="674" y="126" text-anchor="end" class="m mu" font-size="13">day 30</text><text x="674" y="146" text-anchor="end" font-size="15">Expires</text>
<text x="821" y="126" text-anchor="end" class="m mu" font-size="13">day 37</text><text x="821" y="146" text-anchor="end" font-size="15">Treasury can take it</text>
<rect class="cell" x="48" y="184" width="22" height="14" fill="#00000040" style="animation-delay:0ms"/><text x="84" y="196" font-size="15">Open: spend it, or close it</text>
<g class="cell" style="animation-delay:0ms"><rect x="48" y="218" width="22" height="14" class="hatch"/><rect x="48.5" y="218.5" width="21" height="13" class="ac"/></g><text x="84" y="230" font-size="15">From day 25 (5 days left): no new lease, a close is tried. From day 27 (3 days left): an exit if the close failed.</text>
<rect class="cell" x="48.5" y="252.5" width="21" height="13" fill="none" stroke="#626262" stroke-dasharray="3 2" style="animation-delay:0ms"/><text x="84" y="264" font-size="15">7 days after expiry: the treasury can take it, unless an exit is pending.</text>
</svg>
