<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">One request, start to finish</title>
<desc id="d">Three lanes, six steps. You prove that the note can pay and seal the prompt, the operator checks the proof and opens a lease, NEAR AI answers inside its enclave and signs, you check the signature, and the operator settles the charge.</desc>
<style>
text{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',system-ui,sans-serif;fill:#161616}
.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mu{fill:#626262}
.ln{stroke:#d4d4d4;fill:none;stroke-width:1}
.ac{stroke:#3b4cc0;fill:none;stroke-width:1}
.hatch{fill:url(#hatch)}
.pk{animation:pk 15s cubic-bezier(.45,0,.2,1) infinite;opacity:0}
@keyframes pk{0.00%{transform:translate(200px,100px);opacity:1}8.59%{transform:translate(200px,100px)}15.63%{transform:translate(350px,100px);opacity:1}24.22%{transform:translate(350px,100px)}31.25%{transform:translate(500px,160px);opacity:1}39.84%{transform:translate(500px,160px)}46.88%{transform:translate(650px,220px);opacity:1}55.47%{transform:translate(650px,220px)}62.50%{transform:translate(800px,100px);opacity:1}71.09%{transform:translate(800px,100px)}78.13%{transform:translate(950px,160px);opacity:1}92.19%{transform:translate(950px,160px);opacity:1}95.19%{transform:translate(950px,160px);opacity:0}100%{transform:translate(200px,100px);opacity:0}}
.hl{opacity:0;animation:hl 15s linear infinite}
@keyframes hl{0%{opacity:1}14.84%{opacity:1}15.84%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#3b4cc0" stroke-width="1.2"/></pattern>
</defs>

<text x="40" y="36" font-size="22">One request, start to finish</text>
<line x1="40" x2="960" y1="70" y2="70" class="ln"/><text x="48" y="104" class="m mu" font-size="13">You</text>
<line x1="40" x2="960" y1="130" y2="130" class="ln"/><text x="48" y="164" class="m mu" font-size="13">Operator</text>
<line x1="40" x2="960" y1="190" y2="190" class="ln"/><text x="48" y="224" class="m mu" font-size="13">NEAR AI</text><line x1="40" x2="960" y1="250" y2="250" class="ln"/>
<line x1="200" y1="100" x2="350" y2="100" stroke="#626262" stroke-dasharray="3 4"/>
<line x1="350" y1="100" x2="500" y2="160" stroke="#626262" stroke-dasharray="3 4"/>
<line x1="500" y1="160" x2="650" y2="220" stroke="#626262" stroke-dasharray="3 4"/>
<line x1="650" y1="220" x2="800" y2="100" stroke="#626262" stroke-dasharray="3 4"/>
<line x1="800" y1="100" x2="950" y2="160" stroke="#626262" stroke-dasharray="3 4"/>
<g transform="translate(200 100)"><circle r="16" fill="none" class="ln"/><circle r="16" class="hatch hl ac" style="animation-delay:0.00s"/><text y="5" text-anchor="middle" class="m" font-size="14">1</text></g>
<g transform="translate(350 100)"><circle r="16" fill="none" class="ln"/><circle r="16" class="hatch hl ac" style="animation-delay:2.34s"/><text y="5" text-anchor="middle" class="m" font-size="14">2</text></g>
<g transform="translate(500 160)"><circle r="16" fill="none" class="ln"/><circle r="16" class="hatch hl ac" style="animation-delay:4.69s"/><text y="5" text-anchor="middle" class="m" font-size="14">3</text></g>
<g transform="translate(650 220)"><circle r="16" fill="none" class="ln"/><circle r="16" class="hatch hl ac" style="animation-delay:7.03s"/><text y="5" text-anchor="middle" class="m" font-size="14">4</text></g>
<g transform="translate(800 100)"><circle r="16" fill="none" class="ln"/><circle r="16" class="hatch hl ac" style="animation-delay:9.38s"/><text y="5" text-anchor="middle" class="m" font-size="14">5</text></g>
<g transform="translate(950 160)"><circle r="16" fill="none" class="ln"/><circle r="16" class="hatch hl ac" style="animation-delay:11.72s"/><text y="5" text-anchor="middle" class="m" font-size="14">6</text></g>
<circle class="pk" r="5" fill="#3b4cc0"/>
<line x1="48" x2="328" y1="270" y2="270" class="ln"/>
<text x="48" y="292" font-size="16"><tspan class="m mu" font-size="13">1  </tspan>Prove</text>
<text x="48" y="314" class="mu" font-size="13.5">The note can pay, without saying which</text>
<text x="48" y="332" class="mu" font-size="13.5">note.</text>
<line x1="358" x2="638" y1="270" y2="270" class="ln"/>
<text x="358" y="292" font-size="16"><tspan class="m mu" font-size="13">2  </tspan>Seal</text>
<text x="358" y="314" class="mu" font-size="13.5">The prompt is encrypted to the model’s</text>
<text x="358" y="332" class="mu" font-size="13.5">attested key.</text>
<line x1="668" x2="948" y1="270" y2="270" class="ln"/>
<text x="668" y="292" font-size="16"><tspan class="m mu" font-size="13">3  </tspan>Check</text>
<text x="668" y="314" class="mu" font-size="13.5">Proof and nullifier are valid; a lease</text>
<text x="668" y="332" class="mu" font-size="13.5">opens.</text>
<line x1="48" x2="328" y1="366" y2="366" class="ln"/>
<text x="48" y="388" font-size="16"><tspan class="m mu" font-size="13">4  </tspan>Answer</text>
<text x="48" y="410" class="mu" font-size="13.5">The model answers inside its enclave</text>
<text x="48" y="428" class="mu" font-size="13.5">and signs.</text>
<line x1="358" x2="638" y1="366" y2="366" class="ln"/>
<text x="358" y="388" font-size="16"><tspan class="m mu" font-size="13">5  </tspan>Verify</text>
<text x="358" y="410" class="mu" font-size="13.5">Your client checks the model’s</text>
<text x="358" y="428" class="mu" font-size="13.5">signature, and says so only if it</text>
<text x="358" y="446" class="mu" font-size="13.5">holds.</text>
<line x1="668" x2="948" y1="366" y2="366" class="ln"/>
<text x="668" y="388" font-size="16"><tspan class="m mu" font-size="13">6  </tspan>Settle</text>
<text x="668" y="410" class="mu" font-size="13.5">The charge is taken; the rest of the</text>
<text x="668" y="428" class="mu" font-size="13.5">lease is free again.</text>
<text x="40" y="500" class="m mu" font-size="13">The operator never holds the prompt text. Your wallet is not involved until you close or exit.</text>
</svg>
